---

- name: Install monitoring prerequisites
  ansible.builtin.package:
    name: "{{ monitoring_packages }}"
    state: present
    update_cache: true
  become: true

- name: Clone mps-services-monitoring repository
  ansible.builtin.git:
    repo: "{{ monitoring_repo_url }}"
    dest: "{{ monitoring_repo_dest }}"
    version: "{{ monitoring_repo_version }}"
    force: true
  become: true

- name: Ensure target directory exists
  ansible.builtin.file:
    path: "{{ monitoring_repo_dest }}"
    state: directory
    owner: "root"
    group: "{{ user_default_admin_group }}"
    recurse: true
    mode: "2775"
  become: true

- name: Render .env configuration
  ansible.builtin.template:
    src: env.j2
    dest: "{{ monitoring_repo_dest }}/.env"
    owner: root
    group: "{{ user_default_admin_group }}"
    mode: "0664"
  become: true

- name: Materialize service config files from examples
  ansible.builtin.copy:
    src: "{{ monitoring_repo_dest }}/{{ item.src }}"
    dest: "{{ monitoring_repo_dest }}/{{ item.dest }}"
    remote_src: true
    owner: root
    group: "{{ user_default_admin_group }}"
    mode: "0664"
    force: false
  loop: "{{ monitoring_config_files }}"
  become: true

- name: Prepare data directories via setup script
  ansible.builtin.command:
    cmd: bash scripts/setup.sh
    chdir: "{{ monitoring_repo_dest }}"
  become: true
  when: monitoring_enable_setup | bool

- name: Install Wazuh prerequisites
  ansible.builtin.package:
    name: "{{ monitoring_wazuh_packages }}"
    state: present
    update_cache: true
  become: true
  when: monitoring_enable_wazuh | bool

- name: Ensure vm.max_map_count is set for the Wazuh indexer
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    sysctl_set: true
    state: present
    reload: true
  become: true
  when: monitoring_enable_wazuh | bool

- name: Prepare Wazuh certificates and data directories
  ansible.builtin.command:
    cmd: bash scripts/wazuh-setup.sh
    chdir: "{{ monitoring_repo_dest }}"
  become: true
  changed_when: false
  when:
    - monitoring_enable_wazuh | bool
    - monitoring_enable_setup | bool

- name: Start monitoring compose stack
  ansible.builtin.shell: |
    docker compose up -d
  args:
    chdir: "{{ monitoring_repo_dest }}"
  become: true
  changed_when: false
  when: monitoring_enable_service | bool
