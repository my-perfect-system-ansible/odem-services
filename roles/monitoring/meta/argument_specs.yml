---
argument_specs:
  main:
    short_description: Deploy the mps-services-monitoring stack (Prometheus, Loki, Grafana, optional Wazuh SIEM)
    description:
      - Clones the mps-services-monitoring repo, renders its .env from variables,
        materializes the gitignored service config files from their .example
        siblings, runs the repo's setup.sh to prepare the bind-mounted data
        directories, and starts the stack via docker compose.
      - Docker and Docker Compose must already be present on the host.
    options:
      monitoring_enable_service:
        type: bool
        required: false
        default: true
        description: "Bring the compose stack up at the end of the run"
      monitoring_enable_setup:
        type: bool
        required: false
        default: true
        description: "Run the repo's setup.sh to create and chown the data directories"
      monitoring_enable_wazuh:
        type: bool
        required: false
        default: false
        description: "Start the Wazuh SIEM containers via the wazuh compose profile (opt-in; adds roughly 3 GB of RAM)"
      monitoring_packages:
        type: list
        required: false
        elements: str
        default: [git]
        description: "Packages required to clone the repo and run setup.sh"
      monitoring_repo_url:
        type: str
        required: false
        default: "https://github.com/my-perfect-system/mps-services-monitoring.git"
        description: "Git URL for the mps-services-monitoring repo"
      monitoring_repo_version:
        type: str
        required: false
        default: "main"
        description: "Git ref to check out"
      monitoring_repo_dest:
        type: str
        required: false
        description: "Directory the mps-services-monitoring repo is cloned into; defaults to user_default_repo_dir/mps-services-monitoring (see defaults/main.yml)"
      monitoring_bind_ip:
        type: str
        required: false
        default: "127.0.0.1"
        description: "Host IP the service ports bind to (0.0.0.0 for all interfaces)"
      monitoring_grafana_port:
        type: int
        required: false
        default: 3000
        description: "Host port for Grafana"
      monitoring_prometheus_port:
        type: int
        required: false
        default: 9090
        description: "Host port for Prometheus"
      monitoring_loki_port:
        type: int
        required: false
        default: 3100
        description: "Host port for Loki"
      monitoring_grafana_admin_user:
        type: str
        required: false
        default: admin
        description: "Grafana admin username"
      monitoring_grafana_admin_password:
        type: str
        required: false
        default: admin
        description: "Grafana admin password"
      monitoring_prometheus_version:
        type: str
        required: false
        default: v3.12.0
        description: "Prometheus image tag"
      monitoring_loki_version:
        type: str
        required: false
        default: 3.7.2
        description: "Loki image tag"
      monitoring_grafana_version:
        type: str
        required: false
        default: 13.0.2
        description: "Grafana image tag"
      monitoring_wazuh_version:
        type: str
        required: false
        default: "5.0.0-beta5"
        description: "Wazuh image tag (manager, indexer, dashboard)"
      monitoring_wazuh_packages:
        type: list
        required: false
        elements: str
        default: [openssl]
        description: "Packages required by the Wazuh setup script (vendored certificate tool)"
      monitoring_wazuh_indexer_heap_gb:
        type: int
        required: false
        default: 1
        description: "JVM heap size in GB for the Wazuh indexer (uses -Xms/-Xmx)"
      monitoring_wazuh_agent_port:
        type: int
        required: false
        default: 1514
        description: "Host port for Wazuh agent event traffic (TCP)"
      monitoring_wazuh_enrollment_port:
        type: int
        required: false
        default: 1515
        description: "Host port for Wazuh agent enrollment (TCP)"
      monitoring_wazuh_tls_port:
        type: int
        required: false
        default: 1517
        description: "Host port for the Wazuh manager TLS agent listener (TCP)"
      monitoring_wazuh_syslog_port:
        type: int
        required: false
        default: 514
        description: "Host port for Wazuh syslog ingestion (UDP)"
      monitoring_wazuh_api_port:
        type: int
        required: false
        default: 55000
        description: "Host port for the Wazuh manager API (TCP)"
      monitoring_wazuh_dashboard_port:
        type: int
        required: false
        default: 443
        description: "Host port for the Wazuh dashboard https UI"
      monitoring_wazuh_manager_indexer_user:
        type: str
        required: false
        default: wazuh-manager
        description: "Indexer user the Wazuh manager authenticates with (must exist in the indexer's user database)"
      monitoring_wazuh_manager_indexer_password:
        type: str
        required: false
        default: wazuh-manager
        description: "Password for the Wazuh manager's indexer user"
      monitoring_wazuh_dashboard_user:
        type: str
        required: false
        default: kibanaserver
        description: "Indexer user the Wazuh dashboard authenticates with"
      monitoring_wazuh_dashboard_password:
        type: str
        required: false
        default: kibanaserver
        description: "Password for the Wazuh dashboard's indexer user"
      monitoring_config_files:
        type: list
        required: false
        elements: dict
        description: "Mapping of .example config files to their active destination paths (relative to the repo dest)"
